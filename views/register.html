<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - Expense Tracker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create an account</h1>
      <div class="error" id="error"></div>
      <form id="register-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit">Sign Up</button>
      </form>
      <div class="switch">Already have an account? <a href="/login">Log in</a></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        errorBox.textContent = data.error || 'Registration failed';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
