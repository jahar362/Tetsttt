<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Expense Tracker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-header">
    <h1>💰 Expense Tracker</h1>
    <div class="user-info">
      <span id="user-email"></span>
      <button id="logout-btn">Log Out</button>
    </div>
  </div>

  <div class="container">
    <div class="summary">
      <div class="summary-card">
        <div class="label">Total Spent</div>
        <div class="value" id="total-spent">$0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">This Month</div>
        <div class="value" id="month-spent">$0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Number of Expenses</div>
        <div class="value" id="expense-count">0</div>
      </div>
    </div>

    <div class="card">
      <h2>Add Expense</h2>
      <div class="error" id="form-error"></div>
      <form class="expense-form" id="expense-form">
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" required placeholder="e.g. Groceries">
        </div>
        <div class="field">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="card">
      <h2>Expenses</h2>
      <div id="expenses-wrap">
        <table id="expenses-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expenses-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">No expenses yet. Add your first one above.</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'expenses';
    const dateInput = document.getElementById('date');
    dateInput.valueAsDate = new Date();

    async function loadUser() {
      const res = await fetch('/api/me');
      if (!res.ok) {
        window.location.href = '/login';
        return;
      }
      const data = await res.json();
      document.getElementById('user-email').textContent = data.email;
    }

    function getExpenses() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveExpenses(expenses) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    function formatCurrency(n) {
      return '$' + n.toFixed(2);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderExpenses() {
      const expenses = getExpenses().slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
      const tbody = document.getElementById('expenses-body');
      const emptyState = document.getElementById('empty-state');
      const table = document.getElementById('expenses-table');
      tbody.innerHTML = '';

      if (expenses.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
      } else {
        table.style.display = 'table';
        emptyState.style.display = 'none';
      }

      expenses.forEach(exp => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${exp.date}</td>
          <td>${escapeHtml(exp.description)}</td>
          <td><span class="category-tag">${escapeHtml(exp.category)}</span></td>
          <td>${formatCurrency(exp.amount)}</td>
          <td><button class="delete-btn" data-id="${exp.id}">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteExpense(Number(btn.dataset.id)));
      });

      const total = expenses.reduce((sum, e) => sum + e.amount, 0);
      document.getElementById('total-spent').textContent = formatCurrency(total);
      document.getElementById('expense-count').textContent = expenses.length;

      const now = new Date();
      const monthTotal = expenses
        .filter(e => {
          const d = new Date(e.date);
          return d.getUTCFullYear() === now.getFullYear() && d.getUTCMonth() === now.getMonth();
        })
        .reduce((sum, e) => sum + e.amount, 0);
      document.getElementById('month-spent').textContent = formatCurrency(monthTotal);
    }

    function deleteExpense(id) {
      saveExpenses(getExpenses().filter(e => e.id !== id));
      renderExpenses();
    }

    document.getElementById('expense-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('form-error');
      errorBox.style.display = 'none';

      const description = document.getElementById('description').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;

      if (!description || !category || !date || isNaN(amount) || amount <= 0) {
        errorBox.textContent = 'Please fill in all fields with a valid amount';
        errorBox.style.display = 'block';
        return;
      }

      const expenses = getExpenses();
      expenses.push({ id: Date.now(), description, amount, category, date });
      saveExpenses(expenses);

      document.getElementById('expense-form').reset();
      dateInput.valueAsDate = new Date();
      renderExpenses();
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    loadUser();
    renderExpenses();
  </script>
</body>
</html>
